name: Validate SOS paper override
on:
  push:
    branches: [fix/admin-paper-override-20261007]
    paths:
      - .github/workflows/sos-paper-override-build.yml
      - scripts/apply-paper-override.py
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: local-build-placeholder
      SUPABASE_SERVICE_ROLE_KEY: local-build-placeholder
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/admin-paper-override-20261007
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Integrate patch
        run: python3 scripts/apply-paper-override.py
      - name: Reconcile existing manifest and lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Regression tests
        run: node scripts/test-paper-overrides.cjs
      - name: Production build and types
        run: npm run build
      - name: Commit verified integration on feature branch
        run: |
          git config user.name 'SOS Maintenance'
          git config user.email 'sos-maintenance@users.noreply.github.com'
          git rm scripts/apply-paper-override.py .github/workflows/sos-paper-override-build.yml
          git add package-lock.json src/app/admin/WeeklyAssignments.tsx src/app/api/admin/exam-catalog/route.ts src/app/api/admin/exam-slots/route.ts src/app/api/student/portal/route.ts src/app/api/parent/portal/route.ts
          git diff --cached --check
          git commit -m 'SOS: integrate verified administrator paper overrides'
          git push origin HEAD:fix/admin-paper-override-20261007
