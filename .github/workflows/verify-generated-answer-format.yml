name: Verify generated answer format fix
on:
  push:
    branches: [fix/generated-answer-format-20261011]
    paths:
      - src/lib/sos-ai-training.ts
      - .github/workflows/verify-generated-answer-format.yml
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: local-build-placeholder
      SUPABASE_SERVICE_ROLE_KEY: local-build-placeholder
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/generated-answer-format-20261011
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - name: Remove temporary verifier after success
        run: |
          git config user.name 'SOS Maintenance'
          git config user.email 'sos-maintenance@users.noreply.github.com'
          git rm .github/workflows/verify-generated-answer-format.yml
          git commit -m 'SOS: remove temporary answer-format verifier'
          git push origin HEAD:fix/generated-answer-format-20261011
