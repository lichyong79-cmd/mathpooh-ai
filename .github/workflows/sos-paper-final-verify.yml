name: Final SOS paper override verification
on:
  push:
    branches: [fix/admin-paper-override-20261007]
    paths: [.github/workflows/sos-paper-final-verify.yml]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: local-build-placeholder
      SUPABASE_SERVICE_ROLE_KEY: local-build-placeholder
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/admin-paper-override-20261007
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Preserve original platform metadata; add only missing pdf-lib entries
        run: |
          node <<'JS'
          const fs=require('fs'),cp=require('child_process');
          const original=JSON.parse(cp.execFileSync('git',['show','8e9c617af6b5e7067d22e2e933ae3a8ac8fa89a8:package-lock.json'],{encoding:'utf8'}));
          const generated=JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          original.packages[''].dependencies['pdf-lib']=JSON.parse(fs.readFileSync('package.json','utf8')).dependencies['pdf-lib'];
          for(const name of ['node_modules/pdf-lib','node_modules/pdf-lib/node_modules/tslib','node_modules/@pdf-lib/standard-fonts','node_modules/@pdf-lib/upng','node_modules/pako']) {
            if(!generated.packages[name])throw Error('Missing locked dependency: '+name);
            original.packages[name]=generated.packages[name];
          }
          original.packages=Object.fromEntries(Object.entries(original.packages).sort(([a],[b])=>a.localeCompare(b,'en')));
          fs.writeFileSync('package-lock.json',JSON.stringify(original,null,2)+'\n');
          JS
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/test-paper-overrides.cjs
      - run: npm run build
      - name: Keep only verified source changes
        run: |
          git config user.name 'SOS Maintenance'
          git config user.email 'sos-maintenance@users.noreply.github.com'
          git rm .github/workflows/sos-paper-final-verify.yml
          git add package-lock.json
          git diff --cached --check
          git commit -m 'SOS: preserve platform lock metadata after successful regression build'
          git push origin HEAD:fix/admin-paper-override-20261007
